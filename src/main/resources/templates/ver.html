<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 th:text="${title}">Document</h1>
    <a th:href="@{/listar}">Volver &lt;</a>

    <div>

        <div>
            <img th:if="${product.photo != null && #strings.length(product.photo) > 0}" th:src="@{/uploads/img/} + ${product.photo}" th:alt="${product.name}" style="max-width: 25%;">
        </div>

        <ul>
            <li th:text="${product.name}"></li>
            <li th:text="'Id:' + ${product.id}"></li>
            <li th:text="'Price: ' + ${#numbers.formatCurrency(product.price)}"></li>
            <li th:text="'Date' + ${#calendars.format(product.createAt, 'dd/MM/yyyy')}"></li>
        </ul>
    </div>

  </body>
</html>
