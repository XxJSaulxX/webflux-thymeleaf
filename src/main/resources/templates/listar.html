<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <div th:if="${param.error != null}" th:text="${param.error}"></div>
    <div th:if="${param.success != null}" th:text="${param.success}"></div>

    <h1 th:text="${title}">Document</h1>
    <a th:href="@{/form}">Create +</a>

    <table border="1">
        <thead>
            <tr>
                <th>id</th>
                <th>Name</th>
                <th>Price</th>
                <th>Date</th>
                <th>Category</th>
                <th colspan="2"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product: ${ products }">
                <td> <a th:href="@{/ver/} + ${product.id}" th:text="${#strings.abbreviate(product.id, 10)}"></a></td>
                <td th:text="${product.name}"></td>
                <td th:text="${#numbers.formatCurrency(product.price)}"></td>
                <td th:text="${#calendars.format(product.createAt, 'dd/MM/yyyy')}"></td>
                <td th:text="${product.category.name}"></td>
                <td><a th:href="@{/form/} + ${product.id}">EDITAR</a></td>
                <td><a th:href="@{/delete/} + ${product.id}" onclick=" return confirm('Seguro de eliminar el producto?');">ELIMINAR</a></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
